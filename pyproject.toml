[project]
name = "rag-assistant-tests"
version = "0.1.0"
description = "A small RAG assistant with retrieval and grounding tests that run offline in CI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.5,<3",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
pgvector = ["psycopg[binary]>=3.3,<4", "pgvector>=0.5,<1"]

[project.scripts]
rag = "rag_assistant.cli:main"

[dependency-groups]
dev = [
  "pytest>=9.1",
  "pytest-cov>=7.1",
  "hypothesis>=6.170",
  "ruff>=0.17",
  "mypy>=2.4",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["pgvector: needs a Postgres with the vector extension (PGVECTOR_URL)"]

[tool.coverage.run]
source = ["rag_assistant"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_also = ["if __name__ == .__main__.:"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
# a word list reads better as one string than as a 100-item list literal
ignore = ["SIM905"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["pgvector.*"]
ignore_missing_imports = true
